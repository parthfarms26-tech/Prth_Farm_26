<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parth Farm | Booking Database</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap");

:root {
    --bg: #0e1710;
    --bg-2: #121e15;
    --surface: #172319;
    --surface-2: #1e2d21;
    --line: #2b3c2e;
    --text: #f0eee2;
    --muted: #98a596;
    --leaf: #b9e56a;
    --leaf-ink: #0d1a08;
    --avail: #5fd27a;
    --reserved: #e8c25a;
    --booked: #f28b8f;
    --blocked: #8b938b;
    --radius: 14px;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --body: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: var(--body);
    background:
        radial-gradient(900px 400px at 85% -10%, rgba(185, 229, 106, 0.09), transparent 60%),
        var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 48px;
    line-height: 1.45;
}

a { color: inherit; text-decoration: none; }

:focus-visible {
    outline: 2px solid var(--leaf);
    outline-offset: 2px;
}

/* ---------- HEADER ---------- */
.site-header {
    background: rgba(14, 23, 16, 0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 50;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.2px;
}

.brand-mark {
    width: 14px;
    height: 14px;
    background: var(--leaf);
    border-radius: 0 100% 0 100%;
    transform: rotate(-8deg);
}

.nav {
    display: flex;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--line);
    padding: 4px;
    border-radius: 999px;
}

.nav a {
    padding: 7px 16px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    transition: color 0.15s, background 0.15s;
}

.nav a:hover { color: var(--text); }

.nav a.active {
    background: var(--leaf);
    color: var(--leaf-ink);
}

.admin-pill {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 5px 11px;
    border-radius: 999px;
}

/* ---------- LAYOUT ---------- */
.container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 22px 16px;
}

.page-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.page-head h1 {
    font-family: var(--display);
    font-size: 34px;
    line-height: 1.1;
    font-weight: 700;
}

.page-head p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
}

.grid {
    display: grid;
    grid-template-columns: 1.55fr 0.9fr;
    gap: 16px;
    align-items: start;
}

.panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
}

.panel h2 {
    font-family: var(--display);
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 16px;
}

/* ---------- STATS ---------- */
.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 18px;
}

.card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
}

.card-title {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 4px;
}

.card-value {
    font-family: var(--display);
    font-size: 28px;
    font-weight: 700;
    line-height: 1.15;
    font-variant-numeric: lining-nums;
}

.card.money .card-value { color: var(--leaf); }

/* ---------- CALENDAR ---------- */
.calendar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
}

.month-title {
    font-family: var(--display);
    font-size: 24px;
    font-weight: 700;
}

.calendar-buttons { display: flex; gap: 6px; }

.calendar-buttons button {
    background: var(--surface-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 8px 13px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    font-weight: 600;
    min-width: 40px;
}

.calendar-buttons button:hover { border-color: var(--leaf); }

.weekdays,
.calendar {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 6px;
}

.weekdays div {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 6px 0;
    font-weight: 600;
}

.day {
    --c: var(--avail);
    min-height: 78px;
    border: 1px solid rgba(95, 210, 122, 0.18);
    border-radius: 10px;
    padding: 7px 7px 6px;
    cursor: pointer;
    background: var(--bg-2);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
    transition: border-color 0.15s;
}

.day:hover { border-color: var(--c); }
.day.empty { visibility: hidden; pointer-events: none; }

.day-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.day-number { font-size: 13px; font-weight: 600; }

.dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--c);
}

.day-label {
    font-size: 10.5px;
    line-height: 1.2;
    color: var(--muted);
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
}

.day.reserved {
    --c: var(--reserved);
    background: rgba(232, 194, 90, 0.1);
    border-color: rgba(232, 194, 90, 0.4);
}

.day.reserved .day-label { color: var(--reserved); }

.day.booked {
    --c: var(--booked);
    background: rgba(242, 139, 143, 0.13);
    border-color: rgba(242, 139, 143, 0.5);
}

.day.booked .day-label {
    color: var(--text);
    font-weight: 700;
    font-size: 11.5px;
}

.day.blocked {
    --c: var(--blocked);
    border-color: #3a423b;
    background: repeating-linear-gradient(135deg, #1a221b, #1a221b 6px, #161d17 6px, #161d17 12px);
}

.day.today { outline: 2px solid var(--leaf); outline-offset: 1px; }
.day.today .day-number { color: var(--leaf); }

.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 16px;
    color: var(--muted);
    font-size: 12.5px;
}

.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-item i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* ---------- FORM ---------- */
.form-group { margin-bottom: 13px; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 5px;
    font-weight: 500;
}

input, select, textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 12px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    color-scheme: dark;
}

input:focus, select:focus, textarea:focus { border-color: var(--leaf); }
textarea { resize: vertical; min-height: 70px; }

.input-affix { position: relative; }

.input-affix > span {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 15px;
    pointer-events: none;
}

.input-affix > input.pad-rupee { padding-left: 28px; }
.input-affix > input.pad-phone { padding-left: 46px; }

.balance-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg);
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 13px;
    color: var(--muted);
}

.balance-line strong { font-size: 16px; color: var(--leaf); }
.balance-line.bad strong { color: var(--booked); }

/* ---------- BUTTONS ---------- */
.btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 11px;
    cursor: pointer;
    font-weight: 700;
    font-size: 15px;
    font-family: inherit;
    margin-top: 6px;
    transition: filter 0.15s, opacity 0.15s;
}

.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: 0.55; cursor: wait; }

.btn-primary { background: var(--leaf); color: var(--leaf-ink); }
.btn-danger { background: #4d2226; color: #ff9ea4; }
.btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--line); }
.btn-edit { background: #1d3552; color: #8ec3ff; }

.btn-row { display: flex; gap: 10px; }
.btn-row .btn { margin-top: 14px; }

.btn-link {
    display: inline-block;
    width: auto;
    padding: 10px 18px;
    margin-top: 0;
    text-align: center;
}

/* ---------- MODAL ---------- */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(4, 8, 5, 0.78);
    z-index: 100;
    justify-content: center;
    align-items: center;
    padding: 16px;
}

.modal.open { display: flex; }

.modal-content {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px;
    max-height: 85vh;
    overflow-y: auto;
}

.modal-content.small { max-width: 340px; }

.modal-content h3 {
    font-family: var(--display);
    font-size: 22px;
    margin-bottom: 12px;
    padding-right: 30px;
}

.close {
    float: right;
    cursor: pointer;
    color: var(--muted);
    font-size: 26px;
    line-height: 1;
    padding: 2px 6px;
    background: none;
    border: none;
}

.muted { color: var(--muted); }

.detail-list { display: grid; gap: 8px; margin-bottom: 4px; }

.detail-list div {
    display: flex;
    justify-content: space-between;
    gap: 14px;
    font-size: 14px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 8px;
}

.detail-list span:first-child { color: var(--muted); }
.detail-list span:last-child { text-align: right; word-break: break-word; }

/* ---------- STATUS PILLS ---------- */
.pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
}

.pill-booked { background: rgba(242, 139, 143, 0.15); color: var(--booked); }
.pill-reserved { background: rgba(232, 194, 90, 0.15); color: var(--reserved); }
.pill-cancelled { background: rgba(139, 147, 139, 0.18); color: var(--muted); }

/* ---------- TOAST ---------- */
#toasts {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: grid;
    gap: 8px;
    z-index: 200;
    width: min(92vw, 380px);
}

.toast {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-left: 4px solid var(--leaf);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    transition: opacity 0.25s;
}

.toast.error { border-left-color: var(--booked); }
.toast.out { opacity: 0; }

/* ---------- RESPONSIVE ---------- */
@media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
}

@media (max-width: 600px) {
    .site-header { padding: 10px 14px; }
    .brand { font-size: 19px; }
    .admin-pill { display: none; }
    .nav a { padding: 6px 12px; font-size: 13px; }
    .container { padding: 14px 12px; }
    .page-head h1 { font-size: 27px; }
    .panel { padding: 14px; }
    .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .stats .card:last-child { grid-column: 1 / -1; }
    .card { padding: 14px 14px; }
    .card-value { font-size: 23px; }
    .month-title { font-size: 20px; }
    .weekdays, .calendar { gap: 4px; }
    .day { min-height: 62px; padding: 5px 4px; border-radius: 8px; }
    .day-number { font-size: 12px; }
    .day-label { font-size: 9px; }
    .day.booked .day-label { font-size: 9.5px; }
    .legend { gap: 12px; font-size: 12px; }
}

@media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
}

</style>
<style>
.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
}
.toolbar .search { flex: 1 1 240px; }
.toolbar select { width: auto; min-width: 190px; }
.toolbar .btn { width: auto; margin-top: 0; padding: 11px 16px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

.summary {

td.num { font-weight: 700; font-family: var(--display); font-size: 15px; color: var(--leaf); }

td.right, th.right { text-align: right; }

.balance-due { color: var(--reserved); font-weight: 600; }

tr.is-cancelled td { opacity: 0.55; }

.action-btn {

}
.edit-btn { background: #1d3552; color: #8ec3ff; }
.book-btn { background: var(--leaf); color: var(--leaf-ink); }
.cancel-btn { background: #4d2226; color: #ff9ea4; }

.empty-state { text-align: center; color: var(--muted); padding: 40px 10px; white-space: normal; }

/* Phones: each booking becomes a card instead of a wide table */
@media (max-width: 760px) {
    .toolbar select, .toolbar .btn { flex: 1 1 100%; }
    .table-container { border: none; overflow: visible; }
    table, thead, tbody, tr, td { display: block; min-width: 0; }
    thead { display: none; }
    tr {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        margin-bottom: 12px;
        padding: 6px 14px 10px;
    }
    td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 14px;
        border: none;
        padding: 7px 0;
        text-align: right;
        white-space: normal;
    }
    td::before {
        content: attr(data-label);
        color: var(--muted);
        font-size: 12.5px;
        font-weight: 500;
        text-align: left;
        flex-shrink: 0;
    }
    td.right { text-align: right; }
    td.notes { max-width: none; }

    td.actions::before { display: none; }
    tbody tr:hover td { background: none; }
}
</style>

<header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark"></span>Parth Farm</a>
    <nav class="nav">
        <a href="index.html">Calendar</a>
        <a href="bookings.html" class="active">Bookings</a>

    <span class="admin-pill">Admin</span>

<main class="container">

                        <th>Status</th>

                        <th class="right">Balance</th>

</main>

<script>
/* =====================================================
   SUPABASE CONFIG  (shared by index.html + bookings.html)
===================================================== */
const SUPABASE_URL = "https://bolwtbueazlfzeeyggir.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvbHd0YnVlYXpsZnplZXlnZ2lyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MTgxNTAsImV4cCI6MjEwNTI5NDE1MH0.IYGWTYCCIr_S5Gv66AxuRn5RLk_XzLyCTm-FwUM8bXs";
const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =====================================================
   HELPERS
===================================================== */
const $ = (id) => document.getElementById(id);

function escapeHTML(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* Rupee sign + Indian comma grouping: 1234567 -> ₹12,34,567 */
function fmtINR(n) {
    return "₹" + Number(n || 0).toLocaleString("en-IN");
}

/* "2027-03-05" -> "05 Mar 2027" */
function fmtDate(str) {
    if (!str) return "-";
    const d = new Date(str + "T00:00:00");
    if (isNaN(d)) return str;
    return d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
}

/* Date -> "YYYY-MM-DD" (local time, no timezone shift) */
function formatDate(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, "0");
    const d = String(date.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

/* =====================================================
   BOOKING NUMBERS  (1, 2, 3, 4 ...)
   - If your table has a `booking_no` column, that is used (permanent numbers).
   - Otherwise numbers follow the order bookings were created
     (created_at), or by date if there is no created_at.
===================================================== */
function assignNumbers(rows) {
    const sorted = rows.slice().sort((a, b) => {
        if (a.created_at && b.created_at) return new Date(a.created_at) - new Date(b.created_at);
        return String(a.date).localeCompare(String(b.date));
    });
    sorted.forEach((r, i) => {
        r.seq = r.booking_no != null ? r.booking_no : i + 1;
    });
    return sorted;
}

async function fetchBookings() {
    const { data, error } = await supabaseClient.from("bookings").select("*");
    if (error) throw error;
    return assignNumbers(data || []);
}

async function fetchBlockedDates() {
    const { data, error } = await supabaseClient.from("blocked_dates").select("date");
    if (error) throw error;
    return (data || []).map((b) => b.date);
}

/* =====================================================
   TOAST + CONFIRM DIALOG  (replaces alert / confirm)
===================================================== */
function toast(message, type = "ok") {
    let box = $("toasts");
    if (!box) {
        box = document.createElement("div");
        box.id = "toasts";
        document.body.appendChild(box);
    }
    const t = document.createElement("div");
    t.className = "toast " + type;
    t.textContent = message;
    box.appendChild(t);
    setTimeout(() => {
        t.classList.add("out");
        setTimeout(() => t.remove(), 260);
    }, 3200);
}

function confirmDialog(message, okLabel = "Confirm", danger = false) {
    return new Promise((resolve) => {
        const wrap = document.createElement("div");
        wrap.className = "modal open";
        wrap.innerHTML = `
            <div class="modal-content small" role="dialog" aria-modal="true">
                <h3>Are you sure?</h3>
                <p class="muted">${escapeHTML(message)}</p>
                <div class="btn-row">
                    <button class="btn btn-secondary" data-r="0">Go back</button>
                    <button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-r="1">${escapeHTML(okLabel)}</button>
                </div>
            </div>`;
        const done = (val) => { wrap.remove(); resolve(val); };
        wrap.addEventListener("click", (e) => {
            const r = e.target.dataset && e.target.dataset.r;
            if (r === "1") done(true);
            else if (r === "0" || e.target === wrap) done(false);
        });
        document.body.appendChild(wrap);
        wrap.querySelector('[data-r="0"]').focus();
    });
}

/* =====================================================
   MONEY INPUTS  (live ₹ + comma formatting)
   Usage: <input class="money">  ->  call setupMoneyInputs()
   Read value with parseMoney(el.value), set with setMoney(el, n)
===================================================== */
function parseMoney(str) {
    return Number(String(str || "").replace(/[^\d]/g, "")) || 0;
}

function setMoney(el, n) {
    const num = Number(n) || 0;
    el.value = num ? num.toLocaleString("en-IN") : "";
}

function formatMoneyInput(el) {
    const raw = el.value;
    const caret = el.selectionStart == null ? raw.length : el.selectionStart;
    const digitsBefore = raw.slice(0, caret).replace(/\D/g, "").length;
    const digits = raw.replace(/\D/g, "").replace(/^0+(?=\d)/, "").slice(0, 9);
    const formatted = digits ? Number(digits).toLocaleString("en-IN") : "";
    el.value = formatted;

    // keep the cursor where the user was typing
    let pos = 0, count = 0;
    while (pos < formatted.length && count < digitsBefore) {
        if (/\d/.test(formatted[pos])) count++;
        pos++;
    }
    try { el.setSelectionRange(pos, pos); } catch (e) { /* ignore */ }
}

function setupMoneyInputs(onChange) {
    document.querySelectorAll("input.money").forEach((el) => {
        el.addEventListener("input", () => {
            formatMoneyInput(el);
            if (onChange) onChange();
        });
    });
}

/* =====================================================
   MOBILE NUMBER: digits only, max 10
===================================================== */
function setupPhoneInput(el) {
    el.addEventListener("input", () => {
        el.value = el.value.replace(/\D/g, "").slice(0, 10);
    });
}

function cleanPhone(value) {
    const digits = String(value || "").replace(/\D/g, "");
    return digits.length > 10 ? digits.slice(-10) : digits;
}

</script>
<script>
let all = [];
let filter = "All";
let query = "";
let sortMode = "date-asc";

/* =====================================================
   LOAD
===================================================== */
async function load() {
    try {
        all = await fetchBookings();
        render();
    } catch (err) {
        console.error(err);
        $("bookingTable").innerHTML =
            `<tr><td colspan="12" class="empty-state">Could not load bookings: ${escapeHTML(err.message)}</td></tr>`;
        toast("Could not load bookings: " + err.message, "error");
    }
}

/* =====================================================
   FILTER + SORT
===================================================== */
function visibleRows() {
    let rows = all.filter((b) => filter === "All" || b.status === filter);

    const q = query.trim().toLowerCase();
    if (q) {
        const digits = q.replace(/\D/g, "");
        rows = rows.filter((b) =>
            String(b.seq) === q.replace("#", "") ||
            (b.customer || "").toLowerCase().includes(q) ||
            (b.notes || "").toLowerCase().includes(q) ||
            (digits && (b.mobile || "").includes(digits))
        );
    }

    rows.sort((a, b) => {
        switch (sortMode) {
            case "date-desc": return String(b.date).localeCompare(String(a.date));
            case "no-asc": return a.seq - b.seq;
            case "no-desc": return b.seq - a.seq;
            default: return String(a.date).localeCompare(String(b.date));
        }
    });
    return rows;
}

/* =====================================================
   RENDER
===================================================== */
function renderChips() {
    const count = (s) => (s === "All" ? all.length : all.filter((b) => b.status === s).length);
    $("chips").innerHTML = ["All", "Booked", "Reserved", "Cancelled"]
        .map((s) => `<button type="button" class="chip ${s === filter ? "active" : ""}" data-filter="${s}">${s}<b>${count(s)}</b></button>`)
        .join("");
}

function renderSummary(rows) {
    const live = rows.filter((b) => b.status !== "Cancelled");
    const total = live.reduce((s, b) => s + Number(b.total_amount || 0), 0);
    const paid = live.reduce((s, b) => s + Number(b.booking_amount || 0), 0);
    const bal = live.reduce((s, b) => s + Number(b.balance || 0), 0);
    $("summary").innerHTML = `
        <span>Showing<strong>${rows.length}</strong></span>
        <span>Total value<strong>${fmtINR(total)}</strong></span>
        <span>Received<strong class="leaf">${fmtINR(paid)}</strong></span>
        <span>Pending<strong>${fmtINR(bal)}</strong></span>`;
}

function renderTable() {
    const rows = visibleRows();
    renderSummary(rows);

    const tbody = $("bookingTable");
    if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="12" class="empty-state">${
            all.length ? "No bookings match your search." : "No bookings yet. Add the first one from the calendar."
        }</td></tr>`;
        return;
    }

    tbody.innerHTML = rows.map((b) => {
        const cancelled = b.status === "Cancelled";
        const bal = Number(b.balance || 0);
        return `
        <tr class="${cancelled ? "is-cancelled" : ""}">
            <td class="num" data-label="No.">${b.seq}</td>
            <td data-label="Customer"><strong>${escapeHTML(b.customer)}</strong></td>
            <td data-label="Mobile"><a class="tel" href="tel:+91${escapeHTML(cleanPhone(b.mobile))}">${escapeHTML(b.mobile)}</a></td>
            <td data-label="Date">${fmtDate(b.date)}</td>
            <td data-label="Status"><span class="pill pill-${escapeHTML((b.status || "").toLowerCase())}">${escapeHTML(b.status)}</span></td>
            <td class="right" data-label="Total">${fmtINR(b.total_amount)}</td>
            <td class="right" data-label="Paid">${fmtINR(b.booking_amount)}</td>
            <td class="right" data-label="Balance"><span class="${bal > 0 ? "balance-due" : "balance-clear"}">${fmtINR(bal)}</span></td>
            <td data-label="Payment mode">${escapeHTML(b.payment_mode || "-")}</td>
            <td data-label="Payment date">${fmtDate(b.payment_date)}</td>
            <td class="notes" data-label="Notes">${escapeHTML(b.notes || "-")}</td>
            <td class="actions">
                ${!cancelled ? `<a class="action-btn edit-btn" href="index.html?edit=${encodeURIComponent(b.id)}">Edit</a>` : ""}
                ${b.status === "Reserved" ? `<button class="action-btn book-btn" data-act="book" data-id="${escapeHTML(b.id)}">Mark booked</button>` : ""}
                ${!cancelled ? `<button class="action-btn cancel-btn" data-act="cancel" data-id="${escapeHTML(b.id)}">Cancel</button>` : ""}
            </td>
        </tr>`;
    }).join("");
}

function render() {
    renderChips();
    renderTable();
}

/* =====================================================
   ACTIONS
===================================================== */
async function setStatus(id, status, message) {
    try {
        const { error } = await supabaseClient.from("bookings").update({ status }).eq("id", id);
        if (error) throw error;
        toast(message);
        await load();
    } catch (err) {
        console.error(err);
        toast("Error: " + err.message, "error");
    }
}

$("bookingTable").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const id = btn.dataset.id;
    const b = all.find((x) => String(x.id) === String(id));

    if (btn.dataset.act === "book") {
        setStatus(id, "Booked", "Marked as booked.");
    }
    if (btn.dataset.act === "cancel") {
        const ok = await confirmDialog(
            `Cancel booking #${b ? b.seq : ""}${b ? " for " + b.customer : ""}? The date will become available again.`,
            "Cancel booking",
            true
        );
        if (ok) setStatus(id, "Cancelled", "Booking cancelled.");
    }
});

$("chips").addEventListener("click", (e) => {
    const chip = e.target.closest("[data-filter]");
    if (!chip) return;
    filter = chip.dataset.filter;
    render();
});

$("search").addEventListener("input", (e) => { query = e.target.value; renderTable(); });
$("sortBy").addEventListener("change", (e) => { sortMode = e.target.value; renderTable(); });

/* =====================================================
   CSV EXPORT  (opens directly in Excel)
===================================================== */
$("exportBtn").addEventListener("click", () => {
    const rows = visibleRows();
    if (!rows.length) { toast("Nothing to export.", "error"); return; }

    const cell = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
    const head = ["No.", "Customer", "Mobile", "Date", "Status", "Total", "Paid", "Balance", "Payment mode", "Payment date", "Notes"];
    const lines = [head.map(cell).join(",")];
    rows.forEach((b) => {
        lines.push([
            b.seq, b.customer, b.mobile, b.date, b.status,
            b.total_amount || 0, b.booking_amount || 0, b.balance || 0,
            b.payment_mode || "", b.payment_date || "", b.notes || ""
        ].map(cell).join(","));
    });

    const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "parth-farm-bookings.csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(a.href);
});

load();
</script>
</body>
