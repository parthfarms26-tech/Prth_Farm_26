<script>
const SUPABASE_URL = "https://bolwtbueazlfzeeyggir.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvbHd0YnVlYXpsZnplZXlnZ2lyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3MTgxNTAsImV4cCI6MjEwNTI5NDE1MH0.IYGWTYCCIr_S5Gv66AxuRn5RLk_XzLyCTm-FwUM8bXs";
const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
function escapeHTML(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
function fmtINR(n) {
  return "₹" + Number(n || 0).toLocaleString("en-IN");
}
function fmtDate(str) {
  if (!str) return "-";
  const d = new Date(str + "T00:00:00");
  if (isNaN(d)) return str;
  return d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
}
function assignNumbers(rows) {
  const sorted = rows.slice().sort((a, b) => {
    if (a.created_at && b.created_at) return new Date(a.created_at) - new Date(b.created_at);
    return String(a.date).localeCompare(String(b.date));
  });
  sorted.forEach((r, i) => {
    r.seq = r.booking_no != null ? r.booking_no : i + 1;
  });
  return sorted;
}
async function fetchBookings() {
  const { data, error } = await supabaseClient.from("bookings").select("*");
  if (error) throw error;
  return assignNumbers(data || []);
}
function setSync(state) {
  const el = $("sync");
  if (!el) return;
  el.dataset.state = state;
  $("syncText").textContent =
    state === "ok"
      ? "Synced at " + new Date().toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" })
      : state === "error"
      ? "Can't reach database"
      : "Connecting";
}
function toast(message, type = "ok") {
  let box = $("toasts");
  if (!box) {
    box = document.createElement("div");
    box.id = "toasts";
    box.setAttribute("aria-live", "polite");
    document.body.appendChild(box);
  }
  const t = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = message;
  box.appendChild(t);
  setTimeout(() => {
    t.classList.add("out");
    setTimeout(() => t.remove(), 260);
  }, 3200);
}
function confirmDialog(message, okLabel = "Confirm", danger = false) {
  return new Promise((resolve) => {
    const wrap = document.createElement("div");
    wrap.className = "modal open";
    wrap.innerHTML = `
      <div class="modal-content small" role="alertdialog" aria-modal="true" aria-label="Confirm action">
        <h3>Are you sure?</h3>
        <p class="muted">${escapeHTML(message)}</p>
        <div class="btn-row">
          <button class="btn btn-secondary" data-r="0">Go back</button>
          <button class="btn ${danger ? "btn-danger" : "btn-primary"}" data-r="1">${escapeHTML(okLabel)}</button>
        </div>
      </div>`;
    const done = (val) => { wrap.remove(); resolve(val); };
    wrap.addEventListener("click", (e) => {
      const r = e.target.dataset && e.target.dataset.r;
      if (r === "1") done(true);
      else if (r === "0" || e.target === wrap) done(false);
    });
    document.body.appendChild(wrap);
    wrap.querySelector('[data-r="0"]').focus();
  });
}
function cleanPhone(value) {
  const digits = String(value || "").replace(/\D/g, "");
  return digits.length > 10 ? digits.slice(-10) : digits;
}

let all = [];
let filter = "All";
let query = "";
let sortMode = "date-asc";
const pendingOf = (b) => Math.max(Number(b.total_amount || 0) - Number(b.booking_amount || 0) - Number(b.balance_amount || 0), 0);
const MONTH_NAMES = ["january","february","march","april","may","june","july","august","september","october","november","december"];
const MONTH_ABBR  = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];

async function load() {
  try {
    all = await fetchBookings();
    setSync("ok");
    render();
  } catch (err) {
    console.error(err);
    setSync("error");
    $("bookingTable").innerHTML = `<tr><td colspan="14" class="empty-state">Could not load bookings: ${escapeHTML(err.message)}</td></tr>`;
    toast("Could not load bookings: " + err.message, "error");
  }
}

function visibleRows() {
  let rows = all.filter((b) => filter === "All" || b.status === filter);
  const q = query.trim().toLowerCase();
  if (q) {
    const digits = q.replace(/\D/g, "");
    rows = rows.filter((b) => {
      const dateRaw = (b.date || "").toLowerCase();
      const dateFmt = fmtDate(b.date).toLowerCase();
      const monthNum = dateRaw.slice(5, 7);
      const monthNumShort = String(Number(monthNum));
      const m = Number(monthNum) - 1;
      const matchesMonth =
        monthNum === q ||
        monthNumShort === q ||
        (m >= 0 && m <= 11 && (MONTH_NAMES[m].startsWith(q) || MONTH_ABBR[m].startsWith(q)));
      return (
        String(b.seq) === q.replace("#", "") ||
        (b.customer || "").toLowerCase().includes(q) ||
        (b.notes || "").toLowerCase().includes(q) ||
        (digits && (b.mobile || "").includes(digits)) ||
        dateRaw.includes(q) ||
        dateFmt.includes(q) ||
        matchesMonth
      );
    });
  }
  rows.sort((a, b) => {
    switch (sortMode) {
      case "date-desc": return String(b.date).localeCompare(String(a.date));
      case "no-asc": return a.seq - b.seq;
      case "no-desc": return b.seq - a.seq;
      default: return String(a.date).localeCompare(String(b.date));
    }
  });
  return rows;
}

function renderChips() {
  const count = (s) => (s === "All" ? all.length : all.filter((b) => b.status === s).length);
  $("chips").innerHTML = ["All", "Booked", "Reserved", "Cancelled"]
    .map((s) => `<button type="button" class="chip ${s === filter ? "active" : ""}" data-filter="${s}" aria-pressed="${s === filter}">${s === "All" ? "" : "<i></i>"}${s}<b>${count(s)}</b></button>`)
    .join("");
}

function renderSummary(rows) {
  const live = rows.filter((b) => b.status !== "Cancelled");

  // Pending = active bookings only
  const bal = live.reduce((s, b) => s + pendingOf(b), 0);

  // Received = (Advance + Balance) for active + Advance of Cancelled
  const paid = rows.reduce((s, b) => {
    const advance = Number(b.booking_amount || 0);
    const balance = Number(b.balance_amount || 0);
    if (b.status === "Cancelled") {
      return s + advance;
    }
    return s + advance + balance;
  }, 0);

  // Total value = Received + Pending (after both are defined)
  const total = paid + bal;

  $("summary").innerHTML = `
    <div><span>Showing</span><strong>${rows.length}</strong></div>
    <div><span>Total value</span><strong>${fmtINR(total)}</strong></div>
    <div><span>Received</span><strong class="in">${fmtINR(paid)}</strong></div>
    <div><span>Pending</span><strong class="due">${fmtINR(bal)}</strong></div>`;
}

function renderTable() {
  const rows = visibleRows();
  renderSummary(rows);
  const tbody = $("bookingTable");
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="14" class="empty-state">${
      all.length
        ? "No bookings match your search. Try a different name, number or month."
        : "No bookings yet. Add the first one from the calendar."
    }</td></tr>`;
    return;
  }
  tbody.innerHTML = rows
    .map((b, index) => {
      const cancelled = b.status === "Cancelled";
      const bal = pendingOf(b);
      const serial = index + 1;
      return `
    <tr class="${cancelled ? "is-cancelled" : ""}">
      <td class="num" data-label="No."><span>${serial}</span></td>
      <td data-label="Guest"><strong>${escapeHTML(b.customer)}</strong></td>
      <td data-label="Mobile"><a class="tel" href="tel:+91${escapeHTML(cleanPhone(b.mobile))}">${escapeHTML(b.mobile)}</a></td>
      <td data-label="Date">${fmtDate(b.date)}</td>
      <td data-label="Status"><span class="pill pill-${escapeHTML((b.status || "").toLowerCase())}">${escapeHTML(b.status)}</span></td>
      <td class="right" data-label="Total">${fmtINR(b.total_amount)}</td>
      <td class="right" data-label="Advance paid">${fmtINR(b.booking_amount)}</td>
      <td class="right" data-label="Balance paid">${fmtINR(b.balance_amount)}</td>
      <td data-label="Balance paid date">${fmtDate(b.balance_payment_date)}</td>
      <td class="right" data-label="Balance pending"><span class="${bal > 0 ? "balance-due" : "balance-clear"}">${fmtINR(bal)}</span></td>
      <td data-label="Payment mode">${escapeHTML(b.payment_mode || "-")}</td>
      <td data-label="Advance payment date">${fmtDate(b.payment_date)}</td>
      <td class="notes" data-label="Notes">${escapeHTML(b.notes || "-")}</td>
      <td class="actions">
        ${!cancelled ? `<a class="action-btn edit-btn" href="index.html?edit=${encodeURIComponent(b.id)}">Edit</a>` : ""}
        ${b.status === "Reserved" ? `<button class="action-btn book-btn" data-act="book" data-id="${escapeHTML(b.id)}">Mark booked</button>` : ""}
        ${!cancelled ? `<button class="action-btn cancel-btn" data-act="cancel" data-id="${escapeHTML(b.id)}">Cancel</button>` : ""}
      </td>
    </tr>`;
    })
    .join("");
}

function render() {
  renderChips();
  renderTable();
}

async function setStatus(id, status, message) {
  try {
    const { error } = await supabaseClient.from("bookings").update({ status }).eq("id", id);
    if (error) throw error;
    toast(message);
    await load();
  } catch (err) {
    console.error(err);
    toast("Error: " + err.message, "error");
  }
}

$("bookingTable").addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const id = btn.dataset.id;
  const b = all.find((x) => String(x.id) === String(id));
  if (btn.dataset.act === "book") setStatus(id, "Booked", "Marked as booked.");
  if (btn.dataset.act === "cancel") {
    const ok = await confirmDialog(
      `Cancel booking #${b ? b.seq : ""}${b ? " for " + b.customer : ""}? The date will become available again.`,
      "Cancel booking", true);
    if (ok) setStatus(id, "Cancelled", "Booking cancelled.");
  }
});

$("chips").addEventListener("click", (e) => {
  const chip = e.target.closest("[data-filter]");
  if (!chip) return;
  filter = chip.dataset.filter;
  render();
});

$("search").addEventListener("input", (e) => {
  query = e.target.value;
  renderTable();
});

$("sortBy").addEventListener("change", (e) => {
  sortMode = e.target.value;
  renderTable();
});

$("exportBtn").addEventListener("click", () => {
  const rows = visibleRows();
  if (!rows.length) {
    toast("Nothing to export.", "error");
    return;
  }
  const cell = (v) => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  const head = ["No.", "Guest", "Mobile", "Date", "Status", "Total", "Advance paid", "Balance paid", "Balance paid date", "Balance pending", "Payment mode", "Advance payment date", "Notes"];
  const lines = [head.map(cell).join(",")];
  rows.forEach((b, index) => {
    lines.push([
      index + 1,
      b.customer,
      b.mobile,
      b.date,
      b.status,
      b.total_amount || 0,
      b.booking_amount || 0,
      b.balance_amount || 0,
      b.balance_payment_date || "",
      pendingOf(b),
      b.payment_mode || "",
      b.payment_date || "",
      b.notes || ""
    ].map(cell).join(","));
  });
  const blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "parth-inda-bookings.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);
});

load();
</script>
